name: AghathNX Windows build

# Builds AghathNX for Windows (MSVC, x64).
# - Run it by hand from the Actions tab ("Run workflow"): the zip is attached to the run as an
#   artifact.
# - Push a tag like aghathnx-v1.0: the zip is also published as a GitHub pre-release.
on:
  workflow_dispatch:
  push:
    tags:
      - "aghathnx-v*"

permissions:
  contents: read

concurrency:
  group: aghathnx-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(head -n 1 dist/frizti_version.txt | tr -d '\r ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "AghathNX v$version"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-aghathnx-windows-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: cpm-aghathnx-windows-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-aghathnx-windows-${{ github.sha }}-${{ github.run_id }}
          restore-keys: objects-aghathnx-windows-

      # No LICHII_BUILD_TAG: with dist/frizti_version.txt present the build is named
      # "AghathNX v<version>" (CMakeModules/GenerateSCMRev.cmake).
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel

      - name: Stop sccache
        if: always()
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $bin = 'build/release/bin'
          foreach ($exe in 'aghathnx.exe', 'eden-cli.exe') {
            if (-not (Test-Path "$bin/$exe")) { throw "$bin/$exe was not produced" }
          }
          windeployqt --release --no-translations "$bin/aghathnx.exe"
          $folder = "AghathNX-v$version"
          New-Item -ItemType Directory $folder | Out-Null
          Copy-Item -Recurse "$bin/*" $folder -Exclude '*.pdb','*.ilk','*.lib','*.exp'
          Copy-Item LICENSE.txt $folder
          Compress-Archive -Path $folder -DestinationPath "AghathNX-v$version-Windows-x64.zip"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: AghathNX-v${{ steps.version.outputs.version }}-Windows-x64
          path: AghathNX-v${{ steps.version.outputs.version }}-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/aghathnx-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: AghathNX-v${{ needs.build.outputs.version }}-Windows-x64

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="AghathNX-v${{ needs.build.outputs.version }}-Windows-x64.zip"
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "AghathNX v${{ needs.build.outputs.version }}" \
            --notes "Unzip anywhere and run aghathnx.exe. Games, keys and firmware are not included: only use files you obtained legally. Don't download the \"Source code\" archives, they contain no emulator."
